name: Build & Release

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main              # push/merge vào main → build (không tạo Release)
    tags:
      - 'v*.*.*'          # vX.Y.Z → build + tạo GitHub Release
  pull_request:
    branches:
      - main              # mở PR vào main → build để kiểm tra
  workflow_dispatch:      # chạy tay từ Actions tab
    inputs:
      version:
        description: 'Version override (e.g. 1.2.3 or 1.2.3-beta). Leave blank → 0.0.0'
        required: false
        default: ''

# ── Permissions ───────────────────────────────────────────────────────────────
permissions:
  contents: write         # needed to create GitHub Releases & upload assets

# ── Jobs ──────────────────────────────────────────────────────────────────────
jobs:
  build:
    name: Build installer (Windows x64)
    runs-on: windows-latest   # Windows Server 2022 — has WPF build support

    steps:
    # ── 1. Checkout ───────────────────────────────────────────────────────────
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0    # full history so tags are visible

    # ── 2. Resolve version strings ────────────────────────────────────────────
    # Ba trigger cho ra version khác nhau:
    #   push tag v1.2.3        → VERSION=1.2.3        (→ tạo Release)
    #   push/PR vào main       → VERSION=0.0.0-dev+<sha7> (build kiểm tra, không Release)
    #   workflow_dispatch      → VERSION theo input hoặc 0.0.0
    #
    # AssemblyVersion & FileVersion chỉ nhận X.Y.Z.W số nguyên (không có suffix).
    # MC1005 xảy ra nếu truyền "0.0.0-dev" vào AssemblyVersion → tách riêng.
    - name: Resolve version
      id: ver
      shell: pwsh
      run: |
        $event   = "${{ github.event_name }}"
        $refType = "${{ github.ref_type }}"
        $sha7    = "${{ github.sha }}".Substring(0, 7)

        if ($event -eq "push" -and $refType -eq "tag") {
          # Tag push: v1.2.3 → 1.2.3  (hoặc v1.2.3-beta → 1.2.3-beta)
          $raw = "${{ github.ref_name }}" -replace '^v', ''
        } elseif ($event -eq "push" -or $event -eq "pull_request") {
          # Push/PR vào main: đánh dấu rõ là dev build
          $raw = "0.0.0-dev+$sha7"
        } elseif ("${{ inputs.version }}" -ne "") {
          $raw = "${{ inputs.version }}"
        } else {
          $raw = "0.0.0"
        }

        # Strip pre-release suffix để lấy phần số thuần: "1.2.3-beta+abc" → "1.2.3"
        $numeric = ($raw -split '[\-\+]')[0]

        # Đảm bảo đủ 3 phần số
        $parts = $numeric -split '\.'
        while ($parts.Count -lt 3) { $parts += '0' }
        $threePartNumeric = ($parts[0..2]) -join '.'

        $fileVer     = "$threePartNumeric.0"
        $assemblyVer = "$threePartNumeric.0"

        # IS_RELEASE = true chỉ khi push tag (dùng ở step tạo Release)
        $isRelease = ($event -eq "push" -and $refType -eq "tag").ToString().ToLower()

        "VERSION=$raw"                  | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
        "FILE_VERSION=$fileVer"         | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
        "ASSEMBLY_VERSION=$assemblyVer" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
        "IS_RELEASE=$isRelease"         | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

        Write-Host "VERSION          = $raw"
        Write-Host "FILE_VERSION     = $fileVer"
        Write-Host "ASSEMBLY_VERSION = $assemblyVer"
        Write-Host "IS_RELEASE       = $isRelease"

    # ── 3. Setup .NET 8 SDK ───────────────────────────────────────────────────
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # ── 4. Cache NuGet packages ───────────────────────────────────────────────
    - name: Cache NuGet
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
        restore-keys: nuget-${{ runner.os }}-

    # ── 5. Restore dependencies ───────────────────────────────────────────────
    - name: Restore NuGet packages
      run: dotnet restore WpfVideoPlayer.csproj -r win-x64

    # ── 6. Build & Publish ────────────────────────────────────────────────────
    # framework-dependent: users need .NET 8 Desktop Runtime, not the full SDK.
    # All native VLC DLLs are copied to /publish by the VideoLAN.LibVLC.Windows package.
    #
    # Version flags passed separately to avoid the MC1005 error:
    #   -p:Version           → NuGet/semver-aware  (allows pre-release suffix)
    #   -p:FileVersion       → must be X.Y.Z.W numeric
    #   -p:AssemblyVersion   → must be X.Y.Z.W numeric  ← this was the failing one
    - name: Publish (framework-dependent)
      shell: pwsh
      run: |
        dotnet publish WpfVideoPlayer.csproj `
          -c Release `
          -r win-x64 `
          --self-contained false `
          -p:PublishSingleFile=false `
          -p:Version="${{ steps.ver.outputs.VERSION }}" `
          -p:FileVersion="${{ steps.ver.outputs.FILE_VERSION }}" `
          -p:AssemblyVersion="${{ steps.ver.outputs.ASSEMBLY_VERSION }}" `
          -o publish

    # ── 7. Verify publish output ──────────────────────────────────────────────
    - name: Verify publish output
      shell: pwsh
      run: |
        $exe = "publish\WpfVideoPlayer.exe"
        if (-not (Test-Path $exe)) {
          Write-Error "EXE not found at $exe"
          exit 1
        }
        Write-Host "Publish contents:"
        Get-ChildItem publish | Format-Table Name, Length -AutoSize

    # ── 8. Install Inno Setup 6 ───────────────────────────────────────────────
    - name: Install Inno Setup 6
      shell: pwsh
      run: |
        choco install innosetup --no-progress
        $isccDir = "C:\Program Files (x86)\Inno Setup 6"
        if (-not (Test-Path "$isccDir\ISCC.exe")) {
          Write-Error "ISCC.exe not found after install"
          exit 1
        }
        Write-Host "Inno Setup installed at $isccDir"

    # ── 9. Compile installer ──────────────────────────────────────────────────
    - name: Compile Inno Setup installer
      shell: pwsh
      env:
        APP_VERSION: ${{ steps.ver.outputs.VERSION }}
      run: |
        New-Item -ItemType Directory -Force -Path installer_output | Out-Null
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion="$env:APP_VERSION" `
            installer\setup.iss
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Inno Setup compilation failed (exit $LASTEXITCODE)"
          exit 1
        }
        Write-Host "Installer output:"
        Get-ChildItem installer_output | Format-Table Name, Length -AutoSize

    # ── 10. Locate installer file ─────────────────────────────────────────────
    - name: Locate installer artifact
      id: installer
      shell: pwsh
      run: |
        $file = Get-ChildItem installer_output\*.exe | Select-Object -First 1
        if (-not $file) { Write-Error "No installer EXE found"; exit 1 }
        "PATH=$($file.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
        "NAME=$($file.Name)"     | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
        Write-Host "Installer: $($file.FullName)  ($([math]::Round($file.Length/1MB,1)) MB)"

    # ── 11. Upload installer as workflow artifact (always, 30-day retention) ──
    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: VPlayer-Installer-${{ steps.ver.outputs.VERSION }}
        path: ${{ steps.installer.outputs.PATH }}
        retention-days: 30

    # ── 12. Create GitHub Release (tag pushes only) ───────────────────────────
    - name: Create GitHub Release
      if: steps.ver.outputs.IS_RELEASE == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: VPlayer ${{ github.ref_name }}
        draft: false
        prerelease: ${{ contains(steps.ver.outputs.VERSION, '-') }}
        body: |
          ## VPlayer ${{ github.ref_name }}

          ### 📥 Cài đặt
          Tải file **`${{ steps.installer.outputs.NAME }}`** bên dưới và chạy.

          **Yêu cầu:** Windows 10/11 (x64) + [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/en-us/download/dotnet/8.0)

          ### 🎬 Định dạng hỗ trợ
          MP4, MKV, AVI, MOV, WMV, FLV, WebM, M4V, TS, VOB, OGV, 3GP, RMVB, HEVC/H.265 và nhiều hơn nữa

          ### ⌨️ Phím tắt
          | Phím | Chức năng |
          |------|-----------|
          | `Space` | Play / Pause |
          | `F` | Toàn màn hình |
          | `Escape` | Thoát toàn màn hình |
          | `M` | Tắt/bật âm |
          | `Ctrl+O` | Mở file |
          | `←` / `→` | Tua lùi / tiến 5 giây |
          | `↑` / `↓` | Âm lượng |
          | `[` / `]` | Giảm / tăng tốc độ phát |

          ---
          *Built from commit ${{ github.sha }}*
        files: |
          ${{ steps.installer.outputs.PATH }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
